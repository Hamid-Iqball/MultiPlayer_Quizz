version: "3.9"

services:
  postgres:
    image: postgres:14
    container_name: quizz_postgres
    restart: always
    environment:
      POSTGRES_USER: quizzAdmin
      POSTGRES_PASSWORD: quizzPassword
      POSTGRES_DB: quizzDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
